server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html so Flutter handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the latest entry points after a rebuild.
    location ~* (index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
